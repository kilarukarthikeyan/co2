version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ecotrack_db
    environment:
      MYSQL_DATABASE: c02
      MYSQL_ROOT_PASSWORD: Saiteja@4329
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./carbon-tracker
    container_name: ecotrack_backend
    ports:
      - "5000:5000"
    environment:
      - DB_URL=jdbc:mysql://db:3306/c02?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=Saiteja@4329
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: ecotrack_frontend
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  db_data:
