spring.application.name=carbon-tracker

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/c02}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Saiteja@4329}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Flyway (using Hibernate update instead)
spring.flyway.enabled=false

# Run data.sql on every startup (idempotent) to keep reference data (emission factors, badges) populated
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

